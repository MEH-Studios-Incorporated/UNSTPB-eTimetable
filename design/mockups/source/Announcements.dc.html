<html lang="ro">
<head>
<meta charset="utf-8">
<title>Anunțuri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6FA5}a:hover{color:#155785}
.tnum{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Libre Franklin', sans-serif; background: #FAFAF9; color: #292929; overflow: hidden">

<div role="status" style="padding: 8px 16px; background: #292929; color: #EDEDED; font-size: 12px; line-height: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h0M3 3l18 18"></path></svg>
<span class="tnum">Offline. Datele sunt din 28 oct., 09:12.</span>
</div>

<header style="padding: 16px 16px 12px; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Anunțuri</h1>
<span style="font-size: 13px; font-weight: 500; color: #5C5C5A">2 necitite</span>
</header>

<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column">

<a href="#" style="margin: 0 16px 12px; padding: 14px; background: #FFFFFF; border: 1px solid #E3E3E0; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #292929">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #5C5C5A">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M5 17h14l-2-4V5H7v8z"></path></svg>Fixat · Secretariat
</span>
<span style="font-size: 17px; line-height: 22px; font-weight: 600">Orarul semestrului 1 este publicat</span>
<span style="font-size: 14px; line-height: 20px; color: #3A3A38">Verificați grupa și subgrupa din profil. Modificările de sală apar automat în aplicație și primiți notificare.</span>
<span class="tnum" style="font-size: 12px; color: #5C5C5A">29 septembrie</span>
</a>

<ul style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{items}}" as="n" hint-placeholder-count="5">
<li style="border-top: 1px solid #E3E3E0">
<a href="#" style="display: flex; gap: 10px; padding: 14px 0; text-decoration: none; color: #292929">
<span style="{{n.dot}}"></span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="{{n.titleStyle}}">{{n.title}}</span>
<span style="font-size: 14px; line-height: 20px; color: #5C5C5A; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{n.body}}</span>
<span class="tnum" style="font-size: 12px; color: #5C5C5A">{{n.meta}}</span>
</span>
</a>
</li>
</sc-for>
</ul>
</div>

<nav aria-label="Navigare" style="border-top: 1px solid #E3E3E0; background: #FFFFFF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 4px 22px">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
<a href="{{tab.href}}" style="{{tab.style}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.icon}}"></path></svg>
<span style="font-size: 12px; line-height: 16px; font-weight: 600">{{tab.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['Laboratorul de Managementul calității se mută', 'Începând cu 4 noiembrie, laboratoarele grupelor 1541E și 1542E se țin în BN 212 a. Orarul din aplicație este deja actualizat.', 'Azi, 09:40 · Prodecanat', true],
      ['Înscrieri la practica de vară', 'Lista firmelor partenere și formularul de înscriere sunt pe site-ul facultății până pe 15 noiembrie.', 'Ieri, 16:05 · Secretariat', true],
      ['Program secretariat în săptămâna 6', 'Marți secretariatul are program doar între 10:00 și 12:00.', '24 oct. · Secretariat', false],
      ['Burse sociale, documente', 'Dosarele se depun la secretariat. Lista documentelor necesare este atașată.', '20 oct. · Secretariat', false]
    ].map(([title, body, meta, unread]) => ({
      title, body, meta,
      dot: `width: 8px; height: 8px; border-radius: 4px; margin-top: 7px; flex-shrink: 0; background: ${unread ? '#D92A21' : 'transparent'}`,
      titleStyle: `font-size: 15px; line-height: 21px; font-weight: ${unread ? 600 : 500}`
    }));
    const icons = {
      cal: 'M8 3v4M16 3v4M3 10h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z',
      book: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11',
      person: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6',
      bell: 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4'
    };
    const tabs = [['Orar', 'cal', 'Main.dc.html'], ['Materii', 'book', 'Subject.dc.html'], ['Profesori', 'person', 'Professors.dc.html'], ['Anunțuri', 'bell', 'Announcements.dc.html', true]].map(([label, ic, href, active]) => ({
      label, href, icon: icons[ic],
      style: `position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 48px; text-decoration: none; color: ${active ? '#1D6FA5' : '#5C5C5A'}`
    }));
    return { items, tabs };
  }
}
</script>
</body>
</html>
